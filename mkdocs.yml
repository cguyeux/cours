site_name: Cours de Christophe Guyeux
site_url: https://cours.gclab.fr/
site_description: >-
  Supports de travaux pratiques du département informatique de l'IUT
  Nord Franche-Comté. Accessibles sans VPN et sans compte.
site_author: Christophe Guyeux
copyright: >-
  Christophe Guyeux, IUT Nord Franche-Comté — contenu sous licence CC BY-NC-SA 4.0
docs_dir: docs
site_dir: site_build

theme:
  name: material
  language: fr
  # font: false — les polices sont servies par le site, jamais par Google Fonts :
  # aucune adresse IP d'étudiant ne part chez un tiers.
  font: false
  icon:
    logo: material/function-variant
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Accueil: index.md
  - Outils fondamentaux:
      - Le module: outils-fondamentaux/index.md
      - Mise en route: outils-fondamentaux/demarrage.md
      - TP1. Calcul numérique: outils-fondamentaux/tp1-calcul-numerique.md
      - TP2. Arithmétique: outils-fondamentaux/tp2-arithmetique.md
      - TP3. Polynômes et fonctions: outils-fondamentaux/tp3-polynomes-fonctions.md
      - TP4. Matrices et systèmes: outils-fondamentaux/tp4-matrices-gauss.md
      - TP5. Synthèse: outils-fondamentaux/tp5-synthese.md
      - TP6. Géométrie du plan: outils-fondamentaux/tp6-geometrie-plan.md
      - Mémento Python: outils-fondamentaux/memento.md
  - IA générative (BUT3):
      - Le module: ia-generative/index.md
      - Mise en route BUT3: ia-generative/demarrage.md
      - TP1. Premiers pas: ia-generative/tp1-premiers-pas.md
      - TP2. Sorties structurées: ia-generative/tp2-sorties-structurees.md
      - TP3. RAG et bases vectorielles: ia-generative/tp3-rag-vecteurs.md
      - TP4. Agents: ia-generative/tp4-agents.md
      - TP5. Multimodalité: ia-generative/tp5-multimodalite.md
  - IA prédictive (BUT3):
      - Le module: ia-predictive/index.md
      - TP1. Pandas: ia-predictive/tp1-pandas.md
      - TP1bis. GeoPandas: ia-predictive/tp1bis-geopandas.md
      - TP2. Clustering: ia-predictive/tp2-clustering.md
      - TP2bis. Réduction de dimension: ia-predictive/tp2bis-reduction-dimension.md
      - TP3. Classification: ia-predictive/tp3-classification.md
      - TP5. Régression et validation: ia-predictive/tp5-regression.md
      - TP4. XGBoost: ia-predictive/tp4-xgboost.md
      - TP6. Séries temporelles: ia-predictive/tp6-series-temporelles.md
      - TP7. XGBoost, objectifs et métriques: ia-predictive/tp7-xgboost-objectifs-metriques.md
      - TP8. Prétraitement des variables: ia-predictive/tp8-pretraitement.md
      - TP9. XGBoost, explicabilité et causalité: ia-predictive/tp9-xgboost-explicabilite-causalite.md
      - TP10. Théorie de l'information: ia-predictive/tp10-theorie-information.md
  - À propos: a-propos.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Lien vers cette section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: fr

extra_javascript:
  - assets/javascripts/mathjax-config.js
  - assets/vendor/mathjax/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cguyeux
      name: GitHub
  generator: false

not_in_nav: |
  lite/**
