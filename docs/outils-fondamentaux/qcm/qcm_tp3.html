<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM du TP3 : Polynômes et fonctions</title>
<style>
  :root { --ok:#1b8a5a; --ko:#c0392b; --accent:#2c5f8a; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5;
         max-width: 820px; margin: 0 auto; padding: 1.5rem; color:#1a1a1a; background:var(--bg); }
  h1 { color: var(--accent); margin-bottom:.2rem; }
  .meta { color:#666; font-size:.9rem; margin-bottom:1rem; }
  .consignes { background:#eef3f8; border-left:4px solid var(--accent); padding:.6rem .9rem;
               border-radius:4px; margin-bottom:1.2rem; }
  .q { background:#fff; border:1px solid #e1e4e8; border-radius:8px; padding:1rem 1.2rem;
       margin-bottom:1rem; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .q h3 { margin:.1rem 0 .2rem; font-size:1.05rem; }
  .badge { font-size:.72rem; font-weight:600; padding:.1rem .5rem; border-radius:10px;
           margin-left:.4rem; vertical-align:middle; }
  .b-facile{background:#e3f4ea;color:var(--ok);} .b-moyen{background:#fdf3e0;color:#b87600;}
  .b-difficile{background:#fbe6e6;color:var(--ko);} .b-theme{background:#eef0f3;color:#555;}
  .enonce { margin:.4rem 0 .8rem; }
  .opt { display:block; padding:.45rem .6rem; border:1px solid #e1e4e8; border-radius:6px;
         margin:.35rem 0; cursor:pointer; transition:background .12s; }
  .opt:hover { background:#f0f4f8; }
  .opt input { margin-right:.55rem; }
  .opt.correct { border-color:var(--ok); background:#eaf7f0; }
  .opt.wrong   { border-color:var(--ko); background:#fbecec; }
  .just { font-size:.86rem; color:#555; margin:.2rem 0 0 1.7rem; display:none; }
  .just.show { display:block; }
  .src { font-size:.78rem; color:#888; margin-top:.5rem; display:none; }
  .src.show { display:block; }
  .bar { position:sticky; bottom:0; background:var(--bg); padding:.8rem 0; }
  button { background:var(--accent); color:#fff; border:0; padding:.6rem 1.3rem;
           font-size:1rem; border-radius:6px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); margin-left:.5rem; }
  #score { font-size:1.2rem; font-weight:700; margin-left:1rem; }
  .qmark { float:right; font-weight:700; display:none; }
  .qmark.show{display:inline;}
</style>
</head>
<body>
<h1>QCM du TP3 : Polynômes et fonctions</h1>
<div class="meta">Source : docs/outils-fondamentaux/tp3-polynomes-fonctions.md — 8 questions</div>
<div class="consignes">Une seule bonne réponse par question, sauf mention contraire.</div>
<form id="qcm"></form>
<div class="bar">
  <button type="button" onclick="grade()">Valider mes réponses</button>
  <button type="button" class="ghost" onclick="location.reload()">Réinitialiser</button>
  <span id="score"></span>
</div>
<script>
const DATA = {"questions": [{"_enonce": "Avec la convention du TP, quelle liste représente le polynôme 2 + 3x + 5x^3 ?", "_multiple": false, "difficulte": "facile", "theme": "Représentation", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "<code>[2, 3, 0, 5]<\/code>", "correcte": true, "_justification": "Le coefficient constant vient en premier, et le coefficient de x^i est <code>P[i]<\/code>."}, {"_texte": "<code>[5, 0, 3, 2]<\/code>", "correcte": false, "_justification": "C'est la convention inverse, du plus haut degré vers le plus bas."}, {"_texte": "<code>[2, 3, 5]<\/code>", "correcte": false, "_justification": "Le coefficient nul de x^2 doit figurer, sinon les degrés sont décalés."}, {"_texte": "<code>[[0, 2], [1, 3], [3, 5]]<\/code>", "correcte": false, "_justification": "Cette représentation par couples est possible en général, mais ce n'est pas celle du TP."}]}, {"_enonce": "Que fait la boucle <code>for coefficient in reversed(P): total = total * x + coefficient<\/code> ?", "_multiple": false, "difficulte": "moyen", "theme": "Horner", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "Elle évalue le polynôme par le schéma de Horner", "correcte": true, "_justification": "On part du coefficient dominant et on multiplie par x avant d'ajouter le suivant."}, {"_texte": "Elle calcule la dérivée du polynôme", "correcte": false, "_justification": "La dérivée décale et multiplie les coefficients, elle ne les accumule pas."}, {"_texte": "Elle inverse l'ordre des coefficients", "correcte": false, "_justification": "<code>reversed<\/code> parcourt à l'envers, mais le résultat est un nombre, pas une liste."}, {"_texte": "Elle calcule la somme des coefficients", "correcte": false, "_justification": "Ce serait le cas seulement si x valait 1."}]}, {"_enonce": "Sur des flottants, l'évaluation naïve d'un polynôme avec <code>x ** i<\/code> est-elle quadratique en le degré ?", "_multiple": false, "difficulte": "difficile", "theme": "Complexité", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "Non : <code>x ** i<\/code> sur un flottant est une opération unique, donc les deux méthodes sont linéaires et le rapport mesuré reste constant à 2 environ", "correcte": true, "_justification": "La mesure sur les degrés 1 000, 5 000 et 20 000 donne un rapport stable ; le raisonnement quadratique est faux ici."}, {"_texte": "Oui : la puissance x^i coûte i multiplications, donc le total croît comme le carré du degré", "correcte": false, "_justification": "C'est le raisonnement intuitif, et c'est exactement celui que la mesure dément sur des flottants."}, {"_texte": "Oui, mais seulement au-delà du degré 10 000", "correcte": false, "_justification": "Le rapport reste constant y compris au degré 20 000."}, {"_texte": "La question n'a pas de sens, on ne peut pas mesurer un temps en Python", "correcte": false, "_justification": "<code>time.perf_counter<\/code> mesure précisément ce genre d'écart."}]}, {"_enonce": "Dans quel cas le raisonnement quadratique redevient-il valable pour l'évaluation naïve ?", "_multiple": false, "difficulte": "difficile", "theme": "Complexité", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "Quand on évalue en un entier, car Python calcule alors des entiers exacts de plus en plus grands", "correcte": true, "_justification": "Mesuré : le rapport passe de 3,7 à 5,4 entre les degrés 200 et 800, il ne reste plus constant."}, {"_texte": "Quand le polynôme a des coefficients négatifs", "correcte": false, "_justification": "Le signe des coefficients ne change rien au coût."}, {"_texte": "Quand on utilise numpy", "correcte": false, "_justification": "numpy accélérerait les deux méthodes sans changer la nature du raisonnement."}, {"_texte": "Jamais : ce raisonnement est faux en toutes circonstances", "correcte": false, "_justification": "Il est faux sur les flottants, mais redevient juste sur les grands entiers."}]}, {"_enonce": "Que renvoie <code>deriver([2, 3, 0, 5])<\/code> ?", "_multiple": false, "difficulte": "facile", "theme": "Dérivation", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "<code>[3, 0, 15]<\/code>", "correcte": true, "_justification": "Chaque coefficient d'indice i devient i fois ce coefficient, à l'indice i - 1."}, {"_texte": "<code>[0, 3, 0, 15]<\/code>", "correcte": false, "_justification": "Le degré diminue de un : la liste a un élément de moins, pas autant."}, {"_texte": "<code>[2, 6, 0, 20]<\/code>", "correcte": false, "_justification": "Ici les coefficients ont été multipliés sans être décalés."}, {"_texte": "<code>[3, 15]<\/code>", "correcte": false, "_justification": "Le coefficient nul intermédiaire doit être conservé pour ne pas décaler les degrés."}]}, {"_enonce": "Quelle condition la méthode de dichotomie exige-t-elle sur l'intervalle de départ ?", "_multiple": false, "difficulte": "moyen", "theme": "Racines", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "Que f(a) et f(b) soient de signes opposés", "correcte": true, "_justification": "C'est ce changement de signe qui garantit la présence d'une racine et permet de couper l'intervalle."}, {"_texte": "Que f soit dérivable sur l'intervalle", "correcte": false, "_justification": "La dichotomie n'utilise jamais la dérivée : c'est Newton qui en a besoin."}, {"_texte": "Que l'intervalle soit de longueur inférieure à 1", "correcte": false, "_justification": "Aucune contrainte de longueur n'est nécessaire."}, {"_texte": "Que f soit un polynôme", "correcte": false, "_justification": "La dichotomie s'applique à toute fonction continue."}]}, {"_enonce": "Appliquée au polynôme x^3 - 2x + 2 en partant de 0, que fait la méthode de Newton ?", "_multiple": false, "difficulte": "difficile", "theme": "Newton", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "Elle oscille indéfiniment entre 0 et 1, sans jamais converger", "correcte": true, "_justification": "La tangente en 0 renvoie en 1 et celle en 1 renvoie en 0 : c'est un cycle, d'où l'utilité du plafond de tours."}, {"_texte": "Elle converge en quelques tours vers la racine", "correcte": false, "_justification": "C'est le comportement attendu près d'une racine, pas ici."}, {"_texte": "Elle diverge vers l'infini", "correcte": false, "_justification": "Elle ne s'éloigne pas : elle tourne en rond entre deux valeurs."}, {"_texte": "Elle lève immédiatement une division par zéro", "correcte": false, "_justification": "La dérivée en 0 vaut -2, donc aucune division par zéro."}]}, {"_enonce": "Quelles affirmations sont exactes ? (plusieurs réponses)", "_multiple": true, "difficulte": "moyen", "theme": "Comparaison des méthodes", "source_fichier": "tp3-polynomes-fonctions.md", "_source": "tp3-polynomes-fonctions.md", "options": [{"_texte": "La dichotomie est lente mais ne rate jamais une racine si l'intervalle change de signe", "correcte": true, "_justification": "Elle gagne un chiffre binaire de précision par tour, avec une garantie de convergence."}, {"_texte": "Newton double le nombre de décimales exactes à chaque tour près de la racine", "correcte": true, "_justification": "C'est la convergence quadratique, visible aussi dans la méthode de Héron du TP1."}, {"_texte": "Newton converge quel que soit le point de départ", "correcte": false, "_justification": "Loin de la racine, elle peut osciller, diverger, ou converger vers une autre racine."}, {"_texte": "La dichotomie exige le calcul de la dérivée", "correcte": false, "_justification": "Elle n'utilise que les signes de la fonction."}]}]};
const form = document.getElementById('qcm');
DATA.questions.forEach((q, i) => {
  const multi = q._multiple;
  const div = document.createElement('div');
  div.className = 'q'; div.id = 'q'+i;
  let badges = '';
  if (q.difficulte) badges += `<span class="badge b-${q.difficulte}">${q.difficulte}</span>`;
  if (q.theme) badges += `<span class="badge b-theme">${q.theme}</span>`;
  const hint = multi ? ' <small>(plusieurs réponses)</small>' : '';
  let html = `<span class="qmark" id="m${i}"></span><h3>Question ${i+1}${hint}${badges}</h3>`;
  html += `<div class="enonce">${q._enonce}</div>`;
  q.options.forEach((o, j) => {
    const type = multi ? 'checkbox' : 'radio';
    html += `<label class="opt" id="o${i}_${j}">`
          + `<input type="${type}" name="q${i}" value="${j}">${o._texte}</label>`;
    html += `<div class="just" id="j${i}_${j}">${o._justification||''}</div>`;
  });
  if (q.source_fichier) html += `<div class="src" id="s${i}">Source : ${q._source}</div>`;
  div.innerHTML = html;
  form.appendChild(div);
});
function grade(){
  let correct = 0;
  DATA.questions.forEach((q, i) => {
    const chosen = [...form.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value);
    const good = q.options.map((o,j)=>o.correcte?j:-1).filter(j=>j>=0);
    const ok = chosen.length===good.length && chosen.every(j=>good.includes(j));
    if (ok) correct++;
    q.options.forEach((o,j)=>{
      const lab = document.getElementById(`o${i}_${j}`);
      lab.classList.remove('correct','wrong');
      if (o.correcte) lab.classList.add('correct');
      else if (chosen.includes(j)) lab.classList.add('wrong');
      const ju = document.getElementById(`j${i}_${j}`);
      if (ju && o._justification) ju.classList.add('show');
    });
    const m = document.getElementById('m'+i);
    m.textContent = ok ? '✓' : '✗';
    m.style.color = ok ? 'var(--ok)' : 'var(--ko)';
    m.classList.add('show');
    const s = document.getElementById('s'+i); if (s) s.classList.add('show');
  });
  const n = DATA.questions.length;
  const pct = Math.round(100*correct/n);
  const sc = document.getElementById('score');
  sc.textContent = `Score : ${correct} / ${n}  (${pct} %)`;
  sc.style.color = pct>=50 ? 'var(--ok)' : 'var(--ko)';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
</body>
</html>
