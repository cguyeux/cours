<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>QCM du TP4 : Matrices et systèmes linéaires</title>
<style>
  :root { --ok:#1b8a5a; --ko:#c0392b; --accent:#2c5f8a; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5;
         max-width: 820px; margin: 0 auto; padding: 1.5rem; color:#1a1a1a; background:var(--bg); }
  h1 { color: var(--accent); margin-bottom:.2rem; }
  .meta { color:#666; font-size:.9rem; margin-bottom:1rem; }
  .consignes { background:#eef3f8; border-left:4px solid var(--accent); padding:.6rem .9rem;
               border-radius:4px; margin-bottom:1.2rem; }
  .q { background:#fff; border:1px solid #e1e4e8; border-radius:8px; padding:1rem 1.2rem;
       margin-bottom:1rem; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .q h3 { margin:.1rem 0 .2rem; font-size:1.05rem; }
  .badge { font-size:.72rem; font-weight:600; padding:.1rem .5rem; border-radius:10px;
           margin-left:.4rem; vertical-align:middle; }
  .b-facile{background:#e3f4ea;color:var(--ok);} .b-moyen{background:#fdf3e0;color:#b87600;}
  .b-difficile{background:#fbe6e6;color:var(--ko);} .b-theme{background:#eef0f3;color:#555;}
  .enonce { margin:.4rem 0 .8rem; }
  .opt { display:block; padding:.45rem .6rem; border:1px solid #e1e4e8; border-radius:6px;
         margin:.35rem 0; cursor:pointer; transition:background .12s; }
  .opt:hover { background:#f0f4f8; }
  .opt input { margin-right:.55rem; }
  .opt.correct { border-color:var(--ok); background:#eaf7f0; }
  .opt.wrong   { border-color:var(--ko); background:#fbecec; }
  .just { font-size:.86rem; color:#555; margin:.2rem 0 0 1.7rem; display:none; }
  .just.show { display:block; }
  .src { font-size:.78rem; color:#888; margin-top:.5rem; display:none; }
  .src.show { display:block; }
  .bar { position:sticky; bottom:0; background:var(--bg); padding:.8rem 0; }
  button { background:var(--accent); color:#fff; border:0; padding:.6rem 1.3rem;
           font-size:1rem; border-radius:6px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); margin-left:.5rem; }
  #score { font-size:1.2rem; font-weight:700; margin-left:1rem; }
  .qmark { float:right; font-weight:700; display:none; }
  .qmark.show{display:inline;}
</style>
</head>
<body>
<h1>QCM du TP4 : Matrices et systèmes linéaires</h1>
<div class="meta">Source : docs/outils-fondamentaux/tp4-matrices-gauss.md — 8 questions</div>
<div class="consignes">Une seule bonne réponse par question, sauf mention contraire.</div>
<form id="qcm"></form>
<div class="bar">
  <button type="button" onclick="grade()">Valider mes réponses</button>
  <button type="button" class="ghost" onclick="location.reload()">Réinitialiser</button>
  <span id="score"></span>
</div>
<script>
const DATA = {"questions": [{"_enonce": "Pourquoi ne faut-il jamais construire une matrice par <code>[[0] * 3] * 2<\/code> ?", "_multiple": false, "difficulte": "difficile", "theme": "Listes de listes", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "Parce que les deux lignes sont la même liste : modifier un élément de la première modifie aussi la seconde", "correcte": true, "_justification": "L'opérateur de répétition duplique la référence, pas le contenu. Écrire <code>[[0] * 3 for _ in range(2)]<\/code>."}, {"_texte": "Parce que la matrice obtenue a de mauvaises dimensions", "correcte": false, "_justification": "Les dimensions sont correctes, et c'est bien ce qui rend le défaut sournois."}, {"_texte": "Parce que Python interdit la multiplication d'une liste", "correcte": false, "_justification": "L'expression est parfaitement valide, elle ne fait simplement pas ce qu'on croit."}, {"_texte": "Parce que les valeurs ne sont pas initialisées à zéro", "correcte": false, "_justification": "Elles le sont bien ; le problème est le partage des lignes."}]}, {"_enonce": "Le produit de deux matrices carrées de taille n écrit en Python pur demande trois boucles imbriquées. Que devient le temps quand n double ?", "_multiple": false, "difficulte": "moyen", "theme": "Coût", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "Il est multiplié par huit environ", "correcte": true, "_justification": "Le coût croît comme n au cube, et deux au cube vaut huit : c'est ce que la mesure donne entre 40 et 80."}, {"_texte": "Il est multiplié par deux", "correcte": false, "_justification": "Ce serait le cas d'un coût linéaire, qui ne correspond pas à trois boucles imbriquées."}, {"_texte": "Il est multiplié par quatre", "correcte": false, "_justification": "Ce serait un coût quadratique, donc deux boucles seulement."}, {"_texte": "Il reste constant grâce à l'optimisation de Python", "correcte": false, "_justification": "Python n'optimise pas les boucles de cette manière."}]}, {"_enonce": "En numpy, quelle est la différence entre <code>A @ B<\/code> et <code>A * B<\/code> ?", "_multiple": false, "difficulte": "facile", "theme": "numpy", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "<code>@<\/code> est le produit matriciel, <code>*<\/code> multiplie case par case", "correcte": true, "_justification": "Les confondre donne un résultat de la bonne forme et complètement faux."}, {"_texte": "Les deux font le produit matriciel, <code>@<\/code> est seulement plus lisible", "correcte": false, "_justification": "<code>*<\/code> ne fait jamais le produit matriciel sur des tableaux numpy."}, {"_texte": "<code>*<\/code> est le produit matriciel, <code>@<\/code> la puissance", "correcte": false, "_justification": "Les rôles sont inversés, et <code>@<\/code> n'est pas une puissance."}, {"_texte": "<code>@<\/code> ne fonctionne que sur des matrices carrées", "correcte": false, "_justification": "Il fonctionne dès que les dimensions sont compatibles."}]}, {"_enonce": "À quoi sert le pivot partiel, qui consiste à choisir la ligne dont le coefficient est le plus grand en valeur absolue ?", "_multiple": false, "difficulte": "moyen", "theme": "Pivot de Gauss", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "À éviter de diviser par un très petit nombre, ce qui amplifierait les erreurs d'arrondi", "correcte": true, "_justification": "En arithmétique exacte tout pivot non nul conviendrait ; en flottants, le choix change le résultat de plusieurs ordres de grandeur."}, {"_texte": "À accélérer l'élimination", "correcte": false, "_justification": "Le nombre d'opérations est identique ; c'est la précision qui est en jeu."}, {"_texte": "À garantir que le système possède une solution", "correcte": false, "_justification": "L'existence d'une solution ne dépend pas du choix du pivot."}, {"_texte": "À trier les équations par ordre croissant", "correcte": false, "_justification": "Seule la ligne du pivot courant est échangée, il n'y a pas de tri global."}]}, {"_enonce": "Pourquoi la fonction <code>resoudre(A, b)<\/code> du corrigé travaille-t-elle sur une copie de la matrice ?", "_multiple": false, "difficulte": "moyen", "theme": "Bonnes pratiques", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "Pour ne pas abîmer les données de l'appelant, qui en a peut-être encore besoin", "correcte": true, "_justification": "Une fonction qui modifie ses arguments est une source de bogues inépuisable."}, {"_texte": "Parce que Python interdit de modifier une liste passée en argument", "correcte": false, "_justification": "Rien ne l'interdit, et c'est précisément le danger."}, {"_texte": "Pour accélérer les calculs", "correcte": false, "_justification": "La copie coûte du temps plutôt qu'elle n'en fait gagner."}, {"_texte": "Parce que le pivot partiel exige deux exemplaires de la matrice", "correcte": false, "_justification": "Le pivot partiel travaille sur une seule matrice augmentée."}]}, {"_enonce": "Pour résoudre A x = b avec numpy, quelle écriture faut-il retenir ?", "_multiple": false, "difficulte": "difficile", "theme": "Résolution", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "<code>np.linalg.solve(A, b)<\/code>", "correcte": true, "_justification": "Plus rapide et plus précis ; sur la matrice de Hilbert de taille 12, l'erreur est d'environ 0,7 contre 21 pour l'inverse."}, {"_texte": "<code>np.linalg.inv(A) @ b<\/code>", "correcte": false, "_justification": "C'est le réflexe le plus répandu, et le mauvais : calculer l'inverse coûte plus cher et amplifie les arrondis."}, {"_texte": "<code>A / b<\/code>", "correcte": false, "_justification": "Cette écriture divise terme à terme et n'a aucun rapport avec la résolution d'un système."}, {"_texte": "<code>b @ np.linalg.inv(A)<\/code>", "correcte": false, "_justification": "L'ordre est en plus incorrect, et l'inverse reste à proscrire."}]}, {"_enonce": "Le conditionnement de la matrice de Hilbert de taille 12 vaut environ 1,8 x 10^16. Qu'en conclure ?", "_multiple": false, "difficulte": "difficile", "theme": "Conditionnement", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "Le problème lui-même est mal posé : plus aucun chiffre du résultat n'est fiable, et aucun algorithme n'y remédiera", "correcte": true, "_justification": "Le conditionnement atteint l'inverse de la précision des flottants ; ce n'est pas un défaut du programme."}, {"_texte": "Le programme contient une erreur qu'il faut corriger", "correcte": false, "_justification": "Les deux méthodes testées sont correctes ; c'est la matrice qui est pathologique."}, {"_texte": "Il faut augmenter le nombre d'itérations", "correcte": false, "_justification": "Le pivot de Gauss n'est pas une méthode itérative."}, {"_texte": "La matrice n'est pas inversible", "correcte": false, "_justification": "Elle est parfaitement inversible en théorie, et c'est bien ce qui rend le cas instructif."}]}, {"_enonce": "Que représente le produit de deux matrices de rotation du plan ?", "_multiple": false, "difficulte": "moyen", "theme": "Géométrie", "source_fichier": "tp4-matrices-gauss.md", "_source": "tp4-matrices-gauss.md", "options": [{"_texte": "La composition des deux rotations : tourner de 30 degrés puis de 60 revient à tourner de 90", "correcte": true, "_justification": "Le produit matriciel compose les transformations, ce que le TP vérifie numériquement avec <code>np.allclose<\/code>."}, {"_texte": "La somme des deux angles appliquée à chaque coordonnée séparément", "correcte": false, "_justification": "Les coordonnées sont mélangées par la rotation, elles ne se traitent pas séparément."}, {"_texte": "Une homothétie de rapport égal au produit des angles", "correcte": false, "_justification": "Une rotation ne change pas les longueurs."}, {"_texte": "Rien de particulier, le produit de deux rotations n'est pas une rotation", "correcte": false, "_justification": "Le produit de deux rotations planes est bien une rotation."}]}]};
const form = document.getElementById('qcm');
DATA.questions.forEach((q, i) => {
  const multi = q._multiple;
  const div = document.createElement('div');
  div.className = 'q'; div.id = 'q'+i;
  let badges = '';
  if (q.difficulte) badges += `<span class="badge b-${q.difficulte}">${q.difficulte}</span>`;
  if (q.theme) badges += `<span class="badge b-theme">${q.theme}</span>`;
  const hint = multi ? ' <small>(plusieurs réponses)</small>' : '';
  let html = `<span class="qmark" id="m${i}"></span><h3>Question ${i+1}${hint}${badges}</h3>`;
  html += `<div class="enonce">${q._enonce}</div>`;
  q.options.forEach((o, j) => {
    const type = multi ? 'checkbox' : 'radio';
    html += `<label class="opt" id="o${i}_${j}">`
          + `<input type="${type}" name="q${i}" value="${j}">${o._texte}</label>`;
    html += `<div class="just" id="j${i}_${j}">${o._justification||''}</div>`;
  });
  if (q.source_fichier) html += `<div class="src" id="s${i}">Source : ${q._source}</div>`;
  div.innerHTML = html;
  form.appendChild(div);
});
function grade(){
  let correct = 0;
  DATA.questions.forEach((q, i) => {
    const chosen = [...form.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value);
    const good = q.options.map((o,j)=>o.correcte?j:-1).filter(j=>j>=0);
    const ok = chosen.length===good.length && chosen.every(j=>good.includes(j));
    if (ok) correct++;
    q.options.forEach((o,j)=>{
      const lab = document.getElementById(`o${i}_${j}`);
      lab.classList.remove('correct','wrong');
      if (o.correcte) lab.classList.add('correct');
      else if (chosen.includes(j)) lab.classList.add('wrong');
      const ju = document.getElementById(`j${i}_${j}`);
      if (ju && o._justification) ju.classList.add('show');
    });
    const m = document.getElementById('m'+i);
    m.textContent = ok ? '✓' : '✗';
    m.style.color = ok ? 'var(--ok)' : 'var(--ko)';
    m.classList.add('show');
    const s = document.getElementById('s'+i); if (s) s.classList.add('show');
  });
  const n = DATA.questions.length;
  const pct = Math.round(100*correct/n);
  const sc = document.getElementById('score');
  sc.textContent = `Score : ${correct} / ${n}  (${pct} %)`;
  sc.style.color = pct>=50 ? 'var(--ok)' : 'var(--ko)';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
</body>
</html>
