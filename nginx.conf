server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne PAS déclarer de bloc « types » ici : un tel bloc REMPLACE la table MIME
    # héritée de nginx.conf au lieu de l'étendre, et toutes les pages seraient
    # alors servies en application/octet-stream, donc téléchargées au lieu d'être
    # affichées. La table par défaut de nginx 1.29 contient déjà application/wasm,
    # dont Pyodide a besoin.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript
               application/json application/wasm image/svg+xml application/manifest+json;

    # Point d'entrée : jamais mis en cache, sinon un redéploiement reste invisible
    # côté navigateur (piège déjà rencontré sur d'autres sites du domaine).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
    location = /404.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Ressources dont le nom porte une empreinte : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # JupyterLite : gros fichiers stables, mais le service-worker et la configuration
    # doivent rester revalidés à chaque chargement.
    location = /lite/service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
    location = /lite/jupyter-lite.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
    location /lite/static/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
    location /lite/build/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Extensions absentes de la table MIME de nginx. La plus critique est .mjs :
    # servi en application/octet-stream, un module ES est REFUSÉ par le navigateur
    # et JupyterLite ne démarre pas du tout (vérifié : « Failed to fetch dynamically
    # imported module »). On corrige par location plutôt que par un bloc « types »,
    # qui écraserait toute la table héritée.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ~* \.ttf$ {
        default_type font/ttf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }
    location ~* \.ipynb$ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Le site ne charge aucune ressource tierce : on le déclare.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
