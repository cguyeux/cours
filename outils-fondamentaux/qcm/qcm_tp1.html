<script>
const DATA = {"questions": [{"_enonce": "En Python, que vaut <code>17 // 5<\/code> ?", "_multiple": false, "difficulte": "facile", "theme": "Entiers", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "<code>3<\/code>", "correcte": true, "_justification": "<code>//<\/code> donne le quotient de la division entière."}, {"_texte": "<code>3.4<\/code>", "correcte": false, "_justification": "C'est le résultat de <code>17 / 5<\/code>, avec une seule barre."}, {"_texte": "<code>2<\/code>", "correcte": false, "_justification": "<code>2<\/code> est le reste, donné par <code>17 % 5<\/code>."}, {"_texte": "<code>4<\/code>", "correcte": false, "_justification": "Le quotient n'est pas arrondi au plus proche, il est tronqué vers le bas."}]}, {"_enonce": "Que vaut <code>10 / 5<\/code> en Python 3 ?", "_multiple": false, "difficulte": "moyen", "theme": "Entiers", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "<code>2.0<\/code>, un flottant", "correcte": true, "_justification": "<code>/<\/code> rend toujours un flottant, même quand la division tombe juste."}, {"_texte": "<code>2<\/code>, un entier", "correcte": false, "_justification": "C'était le comportement de Python 2, et beaucoup de code trouvé en ligne le suppose encore."}, {"_texte": "<code>2<\/code>, un entier, parce que les deux opérandes sont entiers", "correcte": false, "_justification": "Le type du résultat de <code>/<\/code> ne dépend pas de celui des opérandes."}, {"_texte": "Une erreur, il faut utiliser <code>//<\/code> entre deux entiers", "correcte": false, "_justification": "<code>/<\/code> est parfaitement valide entre deux entiers."}]}, {"_enonce": "Que vaut l'expression <code>0.1 + 0.2 == 0.3<\/code> ?", "_multiple": false, "difficulte": "facile", "theme": "Flottants", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "<code>False<\/code>", "correcte": true, "_justification": "<code>0.1 + 0.2<\/code> vaut <code>0.30000000000000004<\/code> : en base 2, <code>0.1<\/code> est un développement infini que la machine tronque."}, {"_texte": "<code>True<\/code>", "correcte": false, "_justification": "Ce serait vrai en arithmétique exacte, pas en arithmétique flottante."}, {"_texte": "Cela dépend du système d'exploitation", "correcte": false, "_justification": "Le comportement est le même sur tous les langages et tous les processeurs depuis quarante ans."}, {"_texte": "Python lève une erreur de précision", "correcte": false, "_justification": "Aucune erreur n'est levée, et c'est précisément ce qui rend le piège dangereux."}]}, {"_enonce": "Pourquoi préférer <code>math.isclose(a, b)<\/code> à une comparaison du type <code>abs(a - b) &lt; 1e-9<\/code> ?", "_multiple": false, "difficulte": "moyen", "theme": "Flottants", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "Parce que <code>math.isclose<\/code> tient compte de l'ordre de grandeur des nombres comparés", "correcte": true, "_justification": "Un écart de <code>1e-9<\/code> n'a pas le même sens sur des millimètres et sur des distances entre galaxies."}, {"_texte": "Parce que <code>math.isclose<\/code> est plus rapide", "correcte": false, "_justification": "La vitesse n'est pas l'argument ; c'est la pertinence du seuil qui est en jeu."}, {"_texte": "Parce que <code>abs<\/code> ne fonctionne pas sur les flottants", "correcte": false, "_justification": "<code>abs<\/code> fonctionne parfaitement sur les flottants."}, {"_texte": "Parce que <code>math.isclose<\/code> corrige l'erreur d'arrondi", "correcte": false, "_justification": "Aucune fonction ne corrige l'erreur d'arrondi ; on l'accepte et on la borne."}]}, {"_enonce": "Combien de valeurs <code>range(1, 6)<\/code> produit-il, et lesquelles ?", "_multiple": false, "difficulte": "facile", "theme": "Boucles", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "Cinq valeurs : 1, 2, 3, 4, 5", "correcte": true, "_justification": "La borne de départ est incluse, la borne d'arrivée est exclue."}, {"_texte": "Six valeurs : 1, 2, 3, 4, 5, 6", "correcte": false, "_justification": "La borne d'arrivée est exclue : 6 n'apparaît pas."}, {"_texte": "Six valeurs : 0, 1, 2, 3, 4, 5", "correcte": false, "_justification": "Le premier argument fixe le départ ; sans lui, <code>range(6)<\/code> commencerait bien à 0."}, {"_texte": "Quatre valeurs : 2, 3, 4, 5", "correcte": false, "_justification": "La borne de départ est incluse."}]}, {"_enonce": "Une fonction se termine par <code>print(resultat)<\/code> au lieu de <code>return resultat<\/code>. Quelle est la conséquence ?", "_multiple": false, "difficulte": "moyen", "theme": "Fonctions", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "La valeur s'affiche mais ne peut pas être réutilisée : la fonction renvoie <code>None<\/code>", "correcte": true, "_justification": "<code>print<\/code> affiche, <code>return<\/code> renvoie ; sans <code>return<\/code>, une fonction renvoie <code>None<\/code>."}, {"_texte": "Aucune, <code>print<\/code> et <code>return<\/code> sont équivalents", "correcte": false, "_justification": "Ce sont deux opérations distinctes ; les confondre est l'erreur la plus fréquente en début d'apprentissage."}, {"_texte": "La fonction renvoie la chaîne affichée", "correcte": false, "_justification": "<code>print<\/code> ne renvoie rien d'exploitable."}, {"_texte": "Python lève une erreur au moment de l'appel", "correcte": false, "_justification": "Aucune erreur n'est levée, ce qui rend le défaut difficile à repérer."}]}, {"_enonce": "Dans la méthode de Héron, pourquoi le critère d'arrêt s'écrit-il <code>abs(suivant - x) &lt;= tolerance * abs(suivant)<\/code> plutôt que <code>abs(suivant - x) &lt;= tolerance<\/code> ?", "_multiple": false, "difficulte": "difficile", "theme": "Méthodes numériques", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "Parce qu'un critère relatif garde le même sens quel que soit l'ordre de grandeur du nombre traité", "correcte": true, "_justification": "Un écart de <code>1e-12<\/code> est minuscule pour une racine de 2 et inatteignable pour une racine de <code>1e30<\/code>."}, {"_texte": "Parce que la multiplication est plus rapide que la comparaison", "correcte": false, "_justification": "Le coût des deux écritures est identique ; c'est la justesse qui les sépare."}, {"_texte": "Pour éviter une division par zéro", "correcte": false, "_justification": "Aucune division n'apparaît dans le critère d'arrêt."}, {"_texte": "Parce que la valeur absolue ne fonctionne pas sur une différence de flottants", "correcte": false, "_justification": "<code>abs<\/code> fonctionne parfaitement sur une différence de flottants."}]}, {"_enonce": "Quelles précautions la fonction <code>heron(a)<\/code> du corrigé prend-elle avant de commencer ses itérations ? (plusieurs réponses)", "_multiple": true, "difficulte": "difficile", "theme": "Robustesse", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "Elle lève une erreur explicite si <code>a<\/code> est négatif", "correcte": true, "_justification": "Mieux vaut un programme qui s'arrête en disant pourquoi qu'un programme qui continue avec une valeur fausse."}, {"_texte": "Elle traite le cas <code>a = 0<\/code> à part", "correcte": true, "_justification": "Sans ce cas particulier, la première itération diviserait par zéro."}, {"_texte": "Elle arrondit <code>a<\/code> à l'entier le plus proche", "correcte": false, "_justification": "Aucun arrondi n'est fait : cela fausserait le résultat."}, {"_texte": "Elle vérifie que <code>a<\/code> est un entier", "correcte": false, "_justification": "La méthode fonctionne sur n'importe quel réel positif."}]}, {"_enonce": "Que vaut l'epsilon machine, le plus petit <code>eps<\/code> tel que <code>1.0 + eps != 1.0<\/code> ?", "_multiple": false, "difficulte": "moyen", "theme": "Représentation des nombres", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "Environ <code>2.2e-16<\/code>, soit 2 puissance -52", "correcte": true, "_justification": "Un flottant a 52 chiffres binaires après la virgule, donc environ seize chiffres décimaux significatifs."}, {"_texte": "Environ <code>1e-9<\/code>", "correcte": false, "_justification": "C'est une tolérance de comparaison souvent choisie, pas l'epsilon machine."}, {"_texte": "Environ <code>1e-308<\/code>, le plus petit flottant positif", "correcte": false, "_justification": "Le plus petit flottant représentable n'a rien à voir avec l'écart minimal détectable autour de 1."}, {"_texte": "Exactement <code>0<\/code>, car <code>1.0 + eps<\/code> est toujours différent de <code>1.0<\/code> si <code>eps &gt; 0<\/code>", "correcte": false, "_justification": "Faux sur une machine : <code>1e16 + 1 == 1e16<\/code> est vrai."}]}, {"_enonce": "La formule classique des racines du second degré donne, pour <code>x² - 1e8 x + 1 = 0<\/code>, une petite racine fausse de 25 %. Quelle est la cause ?", "_multiple": false, "difficulte": "difficile", "theme": "Élimination catastrophique", "source_fichier": "tp1-calcul-numerique.md", "_source": "tp1-calcul-numerique.md", "options": [{"_texte": "La soustraction <code>-b - sqrt(delta)<\/code> de deux nombres presque égaux efface les chiffres significatifs", "correcte": true, "_justification": "C'est l'élimination catastrophique : le résultat est petit, mais son erreur est celle des grands nombres soustraits."}, {"_texte": "<code>math.sqrt<\/code> est imprécis sur les grands nombres", "correcte": false, "_justification": "La racine carrée est calculée à l'epsilon machine près ; le problème vient de la soustraction qui suit."}, {"_texte": "Python confond <code>/<\/code> et <code>//<\/code> dans la division par <code>2a<\/code>", "correcte": false, "_justification": "La division est correcte ; aucune division entière n'intervient."}, {"_texte": "Le discriminant est négatif", "correcte": false, "_justification": "Le discriminant vaut environ <code>1e16<\/code>, largement positif."}]}]};
const form = document.getElementById('qcm');
DATA.questions.forEach((q, i) => {
  const multi = q._multiple;
  const div = document.createElement('div');
  div.className = 'q'; div.id = 'q'+i;
  let badges = '';
  if (q.difficulte) badges += `<span class="badge b-${q.difficulte}">${q.difficulte}</span>`;
  if (q.theme) badges += `<span class="badge b-theme">${q.theme}</span>`;
  const hint = multi ? ' <small>(plusieurs réponses)</small>' : '';
  let html = `<span class="qmark" id="m${i}"></span><h3>Question ${i+1}${hint}${badges}</h3>`;
  html += `<div class="enonce">${q._enonce}</div>`;
  q.options.forEach((o, j) => {
    const type = multi ? 'checkbox' : 'radio';
    html += `<label class="opt" id="o${i}_${j}">`
          + `<input type="${type}" name="q${i}" value="${j}">${o._texte}</label>`;
    html += `<div class="just" id="j${i}_${j}">${o._justification||''}</div>`;
  });
  if (q.source_fichier) html += `<div class="src" id="s${i}">Source : ${q._source}</div>`;
  div.innerHTML = html;
  form.appendChild(div);
});
function grade(){
  let correct = 0;
  DATA.questions.forEach((q, i) => {
    const chosen = [...form.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value);
    const good = q.options.map((o,j)=>o.correcte?j:-1).filter(j=>j>=0);
    const ok = chosen.length===good.length && chosen.every(j=>good.includes(j));
    if (ok) correct++;
    q.options.forEach((o,j)=>{
      const lab = document.getElementById(`o${i}_${j}`);
      lab.classList.remove('correct','wrong');
      if (o.correcte) lab.classList.add('correct');
      else if (chosen.includes(j)) lab.classList.add('wrong');
      const ju = document.getElementById(`j${i}_${j}`);
      if (ju && o._justification) ju.classList.add('show');
    });
    const m = document.getElementById('m'+i);
    m.textContent = ok ? '✓' : '✗';
    m.style.color = ok ? 'var(--ok)' : 'var(--ko)';
    m.classList.add('show');
    const s = document.getElementById('s'+i); if (s) s.classList.add('show');
  });
  const n = DATA.questions.length;
  const pct = Math.round(100*correct/n);
  const sc = document.getElementById('score');
  sc.textContent = `Score : ${correct} / ${n}  (${pct} %)`;
  sc.style.color = pct>=50 ? 'var(--ok)' : 'var(--ko)';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
